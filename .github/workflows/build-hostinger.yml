name: Build Hostinger site

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'source-assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-hostinger.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-main
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check published catalog
        id: catalog
        run: node scripts/catalog-changed.js
      - if: github.event_name != 'schedule' || steps.catalog.outputs.changed == 'true'
        run: npm run build
      - if: github.event_name != 'schedule' || steps.catalog.outputs.changed == 'true'
        run: npm run validate
      - if: github.event_name != 'schedule' || steps.catalog.outputs.changed == 'true'
        run: npm run sync:hostinger
      - name: Commit built website
        if: github.event_name != 'schedule' || steps.catalog.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --pathspec-from-file=.hostinger-git-paths
          if ! git diff --cached --quiet; then
            git commit -m "Build website for Hostinger"
            git push origin HEAD:main
          fi
